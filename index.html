<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Multi-tenant SaaS admin experience demo."
    />
    <title>OrbitHQ — Multi-tenant SaaS Starter</title>
    <style>
      :root {
        --bg: #10101a;
        --panel: #191827;
        --ink: #f6f3ff;
        --muted: #aaa6bf;
        --violet: #a99bff;
        --pink: #fa8cc8;
        --line: #302e45;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 100% 0, #472d6a55, transparent 38%),
          var(--bg);
        color: var(--ink);
        font:
          15px/1.45 Inter,
          system-ui;
      }
      .app {
        max-width: 1250px;
        margin: auto;
        padding: 24px;
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 18px;
      }
      .side {
        padding: 10px 14px;
        border-right: 1px solid var(--line);
        min-height: 94vh;
      }
      .brand {
        font-weight: 850;
        letter-spacing: -0.04em;
        font-size: 1.25rem;
        margin: 8px 0 44px;
      }
      .brand i {
        font-style: normal;
        color: var(--violet);
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav button {
        padding: 10px;
        border: 0;
        background: transparent;
        color: var(--muted);
        text-align: left;
        border-radius: 7px;
        cursor: pointer;
      }
      .nav button.active {
        background: #312e4c;
        color: var(--ink);
      }
      .content {
        padding: 12px 8px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .tenant {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 8px;
        border-radius: 8px;
      }
      h1 {
        font-size: clamp(2.3rem, 5vw, 4rem);
        letter-spacing: -0.07em;
        line-height: 1;
        margin: 55px 0 12px;
      }
      .lead {
        color: var(--muted);
        max-width: 610px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 34px 0 18px;
      }
      .card {
        background: #191827d9;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 17px;
      }
      .card small {
        color: var(--muted);
      }
      .card b {
        display: block;
        font-size: 1.6rem;
        margin-top: 4px;
      }
      .section {
        background: #191827d9;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        margin-top: 14px;
      }
      .section h2 {
        font-size: 1rem;
        margin: 0 0 13px;
      }
      .member {
        display: grid;
        grid-template-columns: 38px 1fr 0.7fr;
        gap: 11px;
        align-items: center;
        border-top: 1px solid var(--line);
        padding: 11px 0;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--violet), var(--pink));
        color: #1d1731;
        font-weight: 800;
      }
      .role {
        color: var(--violet);
        font-size: 0.82rem;
      }
      .audit {
        color: var(--muted);
        font-size: 0.9rem;
        border-top: 1px solid var(--line);
        padding: 10px 0;
      }
      @media (max-width: 720px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          min-height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand {
          margin-bottom: 12px;
        }
        .nav {
          grid-template-columns: repeat(3, 1fr);
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .member {
          grid-template-columns: 38px 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <aside class="side">
        <div class="brand">ORBIT<i>HQ</i></div>
        <nav class="nav">
          <button class="active">Overview</button><button>Members</button
          ><button>Projects</button><button>Audit log</button
          ><button>Settings</button>
        </nav>
      </aside>
      <section class="content">
        <header class="top">
          <small style="color: var(--muted)">Workspace administration</small
          ><select class="tenant" id="tenant">
            <option>Aarohan Studio</option>
            <option>Udaan Labs</option>
            <option>Kahaani & Co.</option>
          </select>
        </header>
        <h1 id="greeting">
          A clear view of<br /><span style="color: var(--violet)"
            >your workspace.</span
          >
        </h1>
        <p class="lead">
          A multi-tenant admin interface demonstrating organization switching,
          roles, member visibility, and audit context using seeded demo data.
        </p>
        <section class="grid">
          <div class="card">
            <small>Active members</small><b id="members">18</b>
          </div>
          <div class="card">
            <small>Open projects</small><b id="projects">7</b>
          </div>
          <div class="card"><small>Role coverage</small><b>100%</b></div>
        </section>
        <section class="section">
          <h2>Members & access</h2>
          <div id="memberList"></div>
        </section>
        <section class="section">
          <h2>Recent workspace activity</h2>
          <div id="audit"></div>
        </section>
      </section>
    </main>
    <script>
      const info = {
        "Aarohan Studio": {
          m: 18,
          p: 7,
          n: [
            ["AM", "Aarav Mehta", "Owner"],
            ["KT", "Kavya Trivedi", "Admin"],
            ["RS", "Riya Shah", "Member"],
          ],
          a: [
            "Created “Spring campaign”",
            "Changed billing owner",
            "Invited Jyoti Lal",
          ],
        },
        "Udaan Labs": {
          m: 11,
          p: 4,
          n: [
            ["NO", "Nikhil Oberoi", "Owner"],
            ["IM", "Ira Mehta", "Admin"],
            ["SL", "Sana Lal", "Member"],
          ],
          a: [
            "Published a project brief",
            "Enabled SSO policy",
            "Exported workspace report",
          ],
        },
        "Kahaani & Co.": {
          m: 26,
          p: 12,
          n: [
            ["FA", "Fatima Ali", "Owner"],
            ["OR", "Om Reddy", "Admin"],
            ["CJ", "Charu Jain", "Member"],
          ],
          a: [
            "Updated tenant branding",
            "Archived 2 projects",
            "Added guest access",
          ],
        },
      };
      const render = () => {
        let x = info[tenant.value];
        members.textContent = x.m;
        projects.textContent = x.p;
        memberList.innerHTML = x.n
          .map(
            (m) =>
              `<div class="member"><div class="avatar">${m[0]}</div><div><b>${m[1]}</b><br><small style="color:var(--muted)">Verified workspace member</small></div><span class="role">${m[2]}</span></div>`,
          )
          .join("");
        audit.innerHTML = x.a
          .map(
            (a, i) =>
              `<div class="audit"><b>${a}</b><br><small>${i + 2} hours ago · ${tenant.value}</small></div>`,
          )
          .join("");
      };
      tenant.onchange = render;
      render();
    </script>
  </body>
</html>
